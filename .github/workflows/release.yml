name: release

# 태그(v1.2.3)를 푸시하거나 Actions 탭에서 직접 실행하면
# Windows에서 테스트 → 두 가지 exe 빌드 → GitHub 릴리스 생성까지 한 번에 한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v1.0.0). 없으면 현재 커밋에 새로 만든다'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:PublishReadyToRun=true', '-p:DebugType=none', "-p:Version=$version")

          dotnet publish src/SideBySide.App @common --self-contained false -o out/fd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish src/SideBySide.App @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/sc
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Compress-Archive out/fd/SideBySide.exe "SideBySide-$env:TAG-win-x64.zip"
          Compress-Archive out/sc/SideBySide.exe "SideBySide-$env:TAG-win-x64-selfcontained.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            "SideBySide-$env:TAG-win-x64.zip" `
            "SideBySide-$env:TAG-win-x64-selfcontained.zip" `
            --title "SideBySide $env:TAG" `
            --notes-file .github/release-notes.md `
            --target $env:GITHUB_SHA
